# .github/workflows/monitor-ci.yml
name: Monitor CI — Day25 (Rev7)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run QVM explainability trace
        run: python tools/qvm_explainability_trace.py

      - name: Run QVM scoring upgrade
        run: python tools/qvm_scoring_upgrade.py

      - name: Run Incident simulator (deterministic, small)
        run: python tools/incident_simulator.py

      - name: Run pytest
        run: python -m pytest -q

      # ---- New CI-safe monitor verification section ----
      - name: Prepare monitor logs (CI-safe defaults)
        run: |
          mkdir -p logs
          # Minimal placeholder trace for CI
          cat > logs/monitorability_trace.jsonld <<'JSON'
{
  "artifact_id": "CI-DUMMY-TRACE",
  "generated_at": "2025-11-09T00:00:00Z",
  "faith_scores": [0.8],
  "qvm_score": 0.9,
  "explanation_text": "CI placeholder explanation: model flagged due to simple heuristic.",
  "model_output_text": "flagged:true;reason=amount"
}
JSON
          # Minimal placeholder monitor log
          echo '[]' > logs/monitor_log.json

      - name: Run Monitorability Verification (gate)
        run: |
          echo "=== Running monitorability gate ==="
          python tools/verify_monitorability.py \
            --trace logs/monitorability_trace.jsonld \
            --monitor logs/monitor_log.json \
            --out logs/monitorability_snapshot.jsonld
          echo "=== Monitorability check complete ==="
