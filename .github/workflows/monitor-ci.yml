# .github/workflows/monitor-ci.yml
name: Monitor CI — Day25

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Run QVM explainability trace
        run: python tools/qvm_explainability_trace.py

      - name: Run QVM scoring upgrade
        run: python tools/qvm_scoring_upgrade.py

      - name: Run Incident simulator (deterministic, small)
        run: python tools/incident_simulator.py

      - name: Run pytest
        run: python -m pytest -q
