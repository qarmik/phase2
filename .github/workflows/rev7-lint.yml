name: Rev7 Lint

on:
  pull_request:
  push:
    branches:
      - rev7/*

jobs:
  rev7-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install deps
        run: python -m pip install --upgrade pip
      - name: Run rev7 refactor check
        run: python tools/rev7_refactor.py
